<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Post | BlogNest</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        .container {
            width: 650px;
            max-width: 90%;
            margin: 50px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-size: 15px;
            font-family: Arial, sans-serif;
        }

        textarea {
            min-height: 200px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #5267d9;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #4055c2;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #5267d9;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Create a New Blog Post ✍️</h1>

    <form method="POST">

        {% csrf_token %}

        <label>Title</label>

        <input
            type="text"
            name="title"
            placeholder="Enter your post title"
            required
        >

        <label>Category</label>

        <input
            type="text"
            name="category"
            placeholder="e.g. Technology, Travel, Education"
            required
        >

        <label>Content</label>

        <textarea
            name="content"
            placeholder="Write your blog post here..."
            required
        ></textarea>

        <button type="submit">
            Publish Post
        </button>

    </form>

    <a href="{% url 'home' %}" class="back">
        ← Back to BlogNest
    </a>

</div>

</body>
</html>
